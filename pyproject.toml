[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Scratch/experimental files that are not part of the package API, so they are
# kept out of both the sdist and the wheel (and therefore out of an install
# built from either).
exclude = [
    "src/SoftSeg/codedump.py",
    "src/SoftSeg/test.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/SoftSeg"]

[project]
name = "SoftSeg"
version = "0.3.1"
authors = [
  { name="Cecilia Cisar", email="ccisar@ucsc.edu" },
]
description = "Soft transcript-to-cell assignment for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata",
    "dask[array]",
    "geopandas",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "parse",
    "requests",
    "scanpy",
    # vectorised shapely.distance / shapely.contains_xy
    "shapely>=2.0",
    "scikit-image",
    # ndimage.find_objects, for per-cell contouring in SegImagePlotter
    "scipy",
    # delete_element_from_disk, get_centroids, SpatialData.is_backed
    "spatialdata>=0.5",
    "tifffile",
    "tqdm",
]

[project.optional-dependencies]
# Only SupportFuncs.NeighborPredictor needs these; they are a heavy install, so
# they are kept out of the base requirements.
neighbors = [
    "scikit-learn",
    "torch",
]
# SegImagePlotter renders through spatialdata-plot; it is imported lazily, so
# the rest of the package works without it.
plotting = [
    "spatialdata-plot",
]
test = [
    "pytest",
]
